[project]
name = "scope-inspector"
version = "0.1.0"
description = "조준경(라이플스코프) 불량 검사 자동화 프로그램"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyodbc>=5.1",
]

[project.optional-dependencies]
camera = [
    # IDS peak SDK Python bindings - installed separately from IDS Software Suite,
    # not distributed via PyPI in all environments. Package names per IDS docs:
    "ids_peak",
    "ids_peak_ipl",
]
dev = [
    "pytest>=8.0",
]
drive = [
    # scripts/upload_to_drive.py 전용 - 앱 실행에는 필요 없음(샘플 이미지 업로드 유틸리티)
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
